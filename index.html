
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TaskPilot — Your Daily Planner</title>
<style>
:root {
  --navy: #17243b;
  --blue: #4668ed;
  --bg: #f4f6fb;
  --muted: #748096;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 24px 16px;
  background: var(--bg);
  color: var(--navy);
  font-family: Arial, sans-serif;
}
.app { max-width: 680px; margin: 0 auto; }
header { padding: 12px 0 24px; }
.brand { font-size: 14px; color: var(--blue); font-weight: bold; }
h1 { font-size: 32px; margin: 12px 0 8px; }
.subtitle { color: var(--muted); line-height: 1.5; }
.card {
  background: white;
  padding: 22px;
  border-radius: 20px;
  margin-bottom: 18px;
  box-shadow: 0 8px 28px #1a2b4b0b;
}
.stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.stat-number { font-size: 27px; font-weight: bold; }
.stat-label { font-size: 13px; color: var(--muted); margin-top: 6px; }
.progress-track {
  height: 8px;
  background: #e9edf5;
  border-radius: 20px;
  overflow: hidden;
  margin-top: 14px;
}
#progressBar {
  height: 100%;
  width: 0%;
  background: var(--blue);
  transition: width .2s;
}
form { display: flex; gap: 8px; margin-top: 16px; }
input {
  min-width: 0;
  flex: 1;
  padding: 13px;
  border: 1px solid #dce2ee;
  border-radius: 10px;
  font-size: 15px;
}
button {
  padding: 12px 15px;
  border: 0;
  border-radius: 10px;
  background: var(--blue);
  color: white;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
}
h2 { font-size: 18px; }
#taskList { list-style: none; padding: 0; margin: 0; }
.task {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 0;
  border-bottom: 1px solid #edf0f6;
}
.task:last-child { border-bottom: 0; }
.task input { flex: none; width: 18px; height: 18px; }
.task span { flex: 1; overflow-wrap: anywhere; }
.task.done span { color: #8993a5; text-decoration: line-through; }
.delete {
  background: #fff0f0;
  color: #c03939;
  padding: 8px 10px;
}
.empty { color: var(--muted); font-size: 14px; padding: 12px 0; }
footer { text-align: center; color: var(--muted); font-size: 12px; padding: 12px; }
@media (max-width: 420px) {
  h1 { font-size: 28px; }
  .card { padding: 18px; }
  form { flex-wrap: wrap; }
  form input { flex-basis: 100%; }
  form button { width: 100%; }
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">✦ TASKPILOT</div>
    <h1>Your day, under control.</h1>
    <div class="subtitle">Small steps. Clear goals. Real progress.</div>
  </header>

  <section class="stats">
    <div class="card">
      <div class="stat-number" id="total">0</div>
      <div class="stat-label">TOTAL TASKS</div>
    </div>
    <div class="card">
      <div class="stat-number" id="completed">0</div>
      <div class="stat-label">COMPLETED</div>
    </div>
  </section>

  <section class="card">
    <h2>Today's progress</h2>
    <div class="subtitle" id="progressText">Start with one small task.</div>
    <div class="progress-track"><div id="progressBar"></div></div>
  </section>

  <section class="card">
    <h2>My tasks</h2>
    <form id="taskForm">
      <input id="taskInput" placeholder="What do you need to do?" maxlength="200" required>
      <button type="submit">+ Add task</button>
    </form>
    <ul id="taskList"></ul>
    <div id="empty" class="empty">No tasks yet. Add your first task above.</div>
  </section>

  <footer>Your personal productivity space · TaskPilot</footer>
</div>

<script>
const form = document.getElementById("taskForm");
const input = document.getElementById("taskInput");
const list = document.getElementById("taskList");
const empty = document.getElementById("empty");
let tasks = [];

try {
  const saved = JSON.parse(localStorage.getItem("taskpilot-tasks") || "[]");
  if (Array.isArray(saved)) tasks = saved.filter(t =>
    t && typeof t.text === "string" && typeof t.done === "boolean"
  );
} catch (error) {
  tasks = [];
}

function saveTasks() {
  try {
    localStorage.setItem("taskpilot-tasks", JSON.stringify(tasks));
  } catch (error) {
    alert("Could not save tasks in this browser.");
  }
}

function render() {
  list.replaceChildren();
  tasks.forEach((task, index) => {
    const item = document.createElement("li");
    item.className = "task" + (task.done ? " done" : "");

    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.checked = task.done;
    checkbox.setAttribute("aria-label", "Mark task complete");
    checkbox.addEventListener("change", () => {
      tasks[index].done = checkbox.checked;
      saveTasks();
      render();
    });

    const text = document.createElement("span");
    text.textContent = task.text;

    const remove = document.createElement("button");
    remove.className = "delete";
    remove.textContent = "Delete";
    remove.addEventListener("click", () => {
      tasks.splice(index, 1);
      saveTasks();
      render();
    });

    item.append(checkbox, text, remove);
    list.appendChild(item);
  });

  const done = tasks.filter(t => t.done).length;
  document.getElementById("total").textContent = tasks.length;
  document.getElementById("completed").textContent = done;
  document.getElementById("progressBar").style.width =
    (tasks.length ? done / tasks.length * 100 : 0) + "%";
  document.getElementById("progressText").textContent =
    tasks.length ? `${done} of ${tasks.length} tasks completed` :
    "Start with one small task.";
  empty.hidden = tasks.length > 0;
}

form.addEventListener("submit", event => {
  event.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  tasks.push({ text, done: false });
  saveTasks();
  input.value = "";
  render();
  input.focus();
});

render();
</script>
</body>
</html>
